<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FAF6EE" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Wedding Invitation</title>
    <style>
      /* Paint the cream base and a gold ring before any JS arrives. */
      html,
      body {
        margin: 0;
        background: #faf6ee;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 45%, #fbf8f1 0%, #f3ebdd 75%, #ebe0cc 100%);
        z-index: 100;
        transition: opacity 0.6s ease;
      }
      #boot .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      }
      #boot .boot-of {
        margin: 0;
        font:
          300 0.62rem/1 Poppins,
          system-ui,
          sans-serif;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgb(30 27 22 / 0.75);
      }
      #boot .boot-names {
        margin: 0.6rem 0 1.75rem;
        font-size: clamp(2rem, 8.4vw, 3rem);
        font-weight: 500;
        color: #0b3c5d;
      }
      #boot .boot-names i {
        color: #8c6a12;
        font-weight: 400;
      }
      #boot svg {
        width: 44px;
        height: 44px;
        animation: boot-spin 1.6s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
        <p class="boot-of">The wedding of</p>
        <p class="boot-names"><!--boot-names--></p>
        <svg viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="28" stroke="#E8D5A3" stroke-width="1.5" />
          <path
            d="M32 4a28 28 0 0 1 28 28"
            stroke="#C9A227"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>
    <noscript>
      <p
        style="
          font-family: Georgia, serif;
          text-align: center;
          padding: 3rem 1.5rem;
          color: #1e1b16;
        "
      >
        This invitation is an interactive experience — please enable JavaScript to open it.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
